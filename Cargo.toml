[package]
name = "audio-conv"
version = "1.4.0"
edition = "2024"
rust-version = "1.96"
description = "Converts a directory of audio files to Opus, FLAC or MP3 via GStreamer, mirroring its structure"
authors = ["Thomas Heck <t@b128.net>"]
repository = "https://gitlab.com/chpio/audio-conv"
license = "MIT OR Apache-2.0"
categories = [
	"command-line-utilities",
	"multimedia",
	"multimedia::audio",
	"multimedia::encoding",
]
keywords = ["audio", "converter", "opus", "flac", "gstreamer"]
include = [
	"/src/**/*",
	"/example.audio-conv.yaml",
	"/README.md",
	"/CHANGELOG.md",
	"/LICENSE-APACHE",
	"/LICENSE-MIT",
]

[dependencies]
gstreamer = { version = "0.25", features = ["v1_16"] }
gstreamer-base = { version = "0.25", features = ["v1_16"] }
futures = "0.3"
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
regex = "1"
globset = "0.4"
derive_more = { version = "2", features = ["display", "error"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
schemars = "1"
serde_json = "1"

[dependencies.tokio]
version = "1"
default-features = false
features = ["sync", "rt", "macros", "time", "fs", "io-util"]

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
