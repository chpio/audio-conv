name: build-ci-image

on:
  push:
    branches: [main]
    paths:
      - .gitea/ci.Dockerfile
      - .gitea/workflows/build-ci-image.yaml
  # picks up new rust and debian releases
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # kaniko builds without a docker daemon, which the kubernetes runner doesn't have. Its image
    # has no node for actions/checkout, kaniko clones the repo itself (git context).
    container: martizih/kaniko:v1.28.6-debug
    env:
      REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      REGISTRY_USER: ${{ github.repository_owner }}
      REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
    steps:
      - name: login
        run: |
          AUTH="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$AUTH" > /kaniko/.docker/config.json
      - name: build and push
        run: |
          /kaniko/executor \
            --context "git://${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git#$GITHUB_REF#$GITHUB_SHA" \
            --dockerfile .gitea/ci.Dockerfile \
            --destination "$REGISTRY/$REGISTRY_USER/audio-conv-ci:latest"
