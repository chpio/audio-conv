name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # built in the git/images repo
    # The image runs rustc through sccache. Its storage (SCCACHE_REDIS_ENDPOINT and
    # SCCACHE_REDIS_PASSWORD) comes from the runner for every job; don't set it here, an empty
    # value would override it. The image is meant to float: it's rebuilt with the current toolchain
    # and tools every week.
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust-gst:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sccache --show-stats
        if: always()
