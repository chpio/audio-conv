# cargo-deny config (https://embarkstudios.github.io/cargo-deny/), run in CI by `cargo deny check`

[advisories]
# the defaults: vulnerabilities, unmaintained and unsound crates fail, yanked crates warn
ignore = [
	# unsafe-libyaml is unmaintained (archived, no known vulnerability), it comes in through
	# serde_yaml_ng. Replacing the YAML crate would be a task of its own.
	"RUSTSEC-2024-0449",
]

[licenses]
# Unicode-3.0 comes in through unicode-ident, Zlib through foldhash, Apache-2.0 WITH
# LLVM-exception through target-lexicon (build dependency of the GStreamer sys crates); every
# other license in the tree is only an alternative to one of these
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]

[bans]
# several versions of one crate are often unavoidable, so they only warn
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
